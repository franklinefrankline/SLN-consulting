# ==============================================================================
# SLN Consulting — Production Nginx Reverse Proxy Configuration
# File: nginx-reverse-proxy.conf
# ==============================================================================

# 1. Rate Limiting Zone: 5 requests/minute per client IP for enquiry handlers
limit_req_zone $binary_remote_addr zone=sln_enquiry_limit:10m rate=5r/m;

# 2. Upstream Backend Server Definition
# Configure the verified backend address and port for the application:
upstream sln_backend_cluster {
    # Default local application listener (e.g., Node.js / Python / PHP server)
    server 127.0.0.1:3000;
    
    # Or PHP-FPM fastcgi Unix socket (uncomment if using PHP-FPM directly):
    # server unix:/var/run/php/php8.2-fpm.sock;
    
    keepalive 32;
}

# 3. HTTP Server: Redirect all plain HTTP traffic to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name slnconsulting.co.in www.slnconsulting.co.in sln-consulting.vercel.app;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Server: Production Reverse Proxy with SSL Termination & Security Hardening
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name slnconsulting.co.in www.slnconsulting.co.in sln-consulting.vercel.app;

    # SSL / TLS Certificates (Managed by system administrator or Certbot)
    # ssl_certificate /etc/letsencrypt/live/slnconsulting.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/slnconsulting.co.in/privkey.pem;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; frame-ancestors 'self';" always;

    # Document Root for Static Files
    root /var/www/sln-consulting;
    index index.php index.html;

    # Request Body Size Limitation (Enquiry submissions & payloads)
    client_max_body_size 10M;

    # 5. Sensitive File Shield: Block direct access to private files and internal scripts
    location ~* (^/\.|\.env|\.git|\.zip$|\.mjs$|\.json$|\.lock$|\.log$|\.md$|\.bak$|security\.php$|mailer\.php$|.*smtp.*\.php$|^/vendor/) {
        return 404;
    }

    # 6. Static Asset Caching: Serve static assets directly from disk (bypass backend proxy)
    location ~* ^/(assets/|style\.css|favicon\.ico|robots\.txt) {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 7. Form Enquiry Endpoints: Apply Rate Limiting at the Reverse Proxy layer
    location ~* ^/(conmail\.php|conmail1\.php)$ {
        limit_req zone=sln_enquiry_limit burst=3 nodelay;

        proxy_pass http://sln_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffers and Timeouts for Form POST
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 8. Primary Reverse Proxy: Forward all application requests to the backend cluster
    location / {
        proxy_pass http://sln_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forwarded Client Identity & Protocol Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffering & Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Disable Open-Proxy Forwarding
        proxy_intercept_errors off;
    }

    # Custom 404 Error Handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
